name: Validate Programming EXTREME pack

on:
  push:
    branches:
      - codex/install-programming-extreme-pack
    paths:
      - .github/workflows/validate-programming-extreme-pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/install-programming-extreme-pack

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run project tests
        run: python -m pytest -q

      - name: Verify Programming EXTREME skill pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              'brainstorming','dispatching-parallel-agents','executing-plans',
              'finishing-a-development-branch','receiving-code-review',
              'requesting-code-review','subagent-driven-development',
              'systematic-debugging','test-driven-development','using-git-worktrees',
              'using-superpowers','verification-before-completion','writing-plans',
              'writing-skills','improve-codebase-architecture','codebase-design',
              'domain-modeling','diagnosing-bugs','code-review',
              'vercel-react-best-practices','vercel-composition-patterns',
              'frontend-design','webapp-testing','mcp-builder','agent-browser',
              'supabase-postgres-best-practices'
          ]
          lock = json.loads(Path('skills-lock.json').read_text())
          missing_files = [s for s in expected if not Path(f'.agents/skills/{s}/SKILL.md').is_file()]
          missing_lock = [s for s in expected if s not in lock.get('skills', {})]
          assert not missing_files, f'missing skill files: {missing_files}'
          assert not missing_lock, f'missing lock entries: {missing_lock}'
          assert len(expected) == 26
          print('validated 26 Programming EXTREME skills')
          PY
