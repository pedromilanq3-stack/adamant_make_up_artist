name: YSOS Android Build

on:
  push:
    branches:
      - feature/ysos-autolike-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app
          cat ysos-src/part*.b64 | base64 -d > /tmp/ysos-src.tar.gz
          gzip -t /tmp/ysos-src.tar.gz
          tar -xzf /tmp/ysos-src.tar.gz -C android-app

          # Compose exposes weight through RowScope; the explicit import is stale.
          sed -i '/import androidx.compose.foundation.layout.weight/d' android-app/app/src/main/java/com/ysoshelper/autolike/ui/MainScreen.kt

          # Safety rule: all semantic like matches are considered together. If two
          # distinct actionable nodes look like Like/Curtir, the matcher must return
          # Ambiguous instead of choosing one based on selector priority.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/ysoshelper/autolike/matching/YsosUiMatcher.kt')
          s = p.read_text()
          old = '''        val calibrated = actionable.filter { node ->
                      node.viewId != null && node.viewId in YsosSelectors.calibratedLikeViewIds
                  }
                  match(calibrated)?.let { return it }

                  val byDescription = actionable.filter { node ->
                      normalize(node.contentDescription) in YsosSelectors.likeLabels
                  }
                  match(byDescription)?.let { return it }

                  val byText = actionable.filter { node ->
                      normalize(node.text) in YsosSelectors.likeLabels
                  }
                  return match(byText) ?: LikeMatch.None
          '''
          new = '''        val candidates = actionable.filter { node ->
                      val calibratedId = node.viewId != null && node.viewId in YsosSelectors.calibratedLikeViewIds
                      val explicitDescription = normalize(node.contentDescription) in YsosSelectors.likeLabels
                      val explicitText = normalize(node.text) in YsosSelectors.likeLabels
                      calibratedId || explicitDescription || explicitText
                  }.distinctBy { it.ref }

                  return match(candidates) ?: LikeMatch.None
          '''
          if old not in s:
              raise SystemExit('Expected YsosUiMatcher block not found')
          p.write_text(s.replace(old, new))
          PY

          # Regression test for the Motorola task-switch race observed on-device.
          # At this stage the test is intentionally red until the production guard exists.
          python3 ysos-ci/patch_snapshot_guard.py

          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: android-app
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        working-directory: android-app
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK structure
        shell: bash
        run: |
          set -euo pipefail
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          chmod +x android-app/scripts/package-source.sh
          (cd android-app && ./scripts/package-source.sh)
          cp android-app/ysos-autolike-source.zip .
          sha256sum app-debug.apk ysos-autolike-source.zip > SHA256SUMS.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: ysos-autolike-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            app-debug.apk
            ysos-autolike-source.zip
            SHA256SUMS.txt
            android-app/docs/INSTALL.md
            android-app/docs/SELECTOR_CALIBRATION.md
