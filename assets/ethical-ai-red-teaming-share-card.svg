<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Ethical AI Red Teaming — Academic Skill Blueprint</title>
  <desc id="desc">A share card summarizing a controlled and reproducible academic framework for evaluating AI alignment without operational jailbreaks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102547"/>
      <stop offset="1" stop-color="#16304c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de4c1"/>
      <stop offset="1" stop-color="#69a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020811" flood-opacity="0.38"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #a9bad1; }
      .card { fill: #10243e; stroke: #294361; stroke-width: 2; }
      .eyebrow { fill: #57dfc3; font-size: 19px; font-weight: 700; letter-spacing: 3px; }
      .section { fill: #f5f9ff; font-size: 25px; font-weight: 750; }
      .body { fill: #bdcbe0; font-size: 20px; font-weight: 450; }
      .tag { fill: #d6e4f5; font-size: 17px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="972" cy="110" r="255" fill="#2a67a8" opacity="0.16"/>
  <circle cx="75" cy="1240" r="270" fill="#25b89b" opacity="0.09"/>
  <path d="M0 306 C270 240 810 375 1080 275" fill="none" stroke="#6aa8ff" stroke-opacity="0.11" stroke-width="2"/>

  <g class="sans">
    <rect x="70" y="64" width="245" height="42" rx="21" fill="#153d4a" stroke="#3cbda7"/>
    <text x="192.5" y="92" text-anchor="middle" class="eyebrow" font-size="15">TCC • CYBERSECURITY</text>

    <text x="70" y="166" fill="#f7fbff" font-size="64" font-weight="800" letter-spacing="-2">ETHICAL AI</text>
    <text x="70" y="232" fill="url(#accent)" font-size="64" font-weight="800" letter-spacing="-2">RED TEAMING</text>
    <text x="70" y="278" class="muted" font-size="23">Academic skill blueprint for controlled alignment evaluation</text>

    <g transform="translate(836 86)">
      <path d="M78 0 L146 26 V82 C146 130 118 164 78 182 C38 164 10 130 10 82 V26 Z" fill="#0d2038" stroke="#54d8bf" stroke-width="3"/>
      <path d="M48 88 L69 109 L111 63" fill="none" stroke="#66a9ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="336" width="940" height="142" rx="25" class="card"/>
      <rect x="70" y="336" width="9" height="142" rx="5" fill="#51dfc2"/>
      <text x="106" y="380" class="section">OBJECTIVE</text>
      <text x="106" y="417" class="body">Test when a model maintains—or loses—alignment under adversarial pressure,</text>
      <text x="106" y="448" class="body">then document the evidence ethically, consistently, and reproducibly.</text>
    </g>

    <text x="70" y="535" class="eyebrow">TEST CATEGORIES</text>
    <g transform="translate(70 560)">
      <g><rect width="292" height="76" rx="17" fill="#142c49" stroke="#31506e"/><circle cx="36" cy="38" r="12" fill="#4de4c1"/><text x="62" y="45" class="tag">Pressure attempts</text></g>
      <g transform="translate(324 0)"><rect width="292" height="76" rx="17" fill="#142c49" stroke="#31506e"/><circle cx="36" cy="38" r="12" fill="#5bcbd5"/><text x="62" y="45" class="tag">Context manipulation</text></g>
      <g transform="translate(648 0)"><rect width="292" height="76" rx="17" fill="#142c49" stroke="#31506e"/><circle cx="36" cy="38" r="12" fill="#69a7ff"/><text x="62" y="45" class="tag">Instruction conflicts</text></g>
      <g transform="translate(0 96)"><rect width="292" height="76" rx="17" fill="#142c49" stroke="#31506e"/><circle cx="36" cy="38" r="12" fill="#4de4c1"/><text x="62" y="45" class="tag">Constrained roleplay</text></g>
      <g transform="translate(324 96)"><rect width="292" height="76" rx="17" fill="#142c49" stroke="#31506e"/><circle cx="36" cy="38" r="12" fill="#5bcbd5"/><text x="62" y="45" class="tag">Ambiguous requests</text></g>
      <g transform="translate(648 96)"><rect width="292" height="76" rx="17" fill="#142c49" stroke="#31506e"/><circle cx="36" cy="38" r="12" fill="#69a7ff"/><text x="62" y="45" class="tag">Hostile environments</text></g>
    </g>

    <g transform="translate(70 785)">
      <rect width="450" height="322" rx="25" class="card"/>
      <text x="34" y="49" class="section">CONTROLLED BY DESIGN</text>
      <g class="body">
        <text x="36" y="97" fill="#55dfc3">✓</text><text x="68" y="97">Synthetic scenarios only</text>
        <text x="36" y="139" fill="#55dfc3">✓</text><text x="68" y="139">Clear authorization &amp; scope</text>
        <text x="36" y="181" fill="#55dfc3">✓</text><text x="68" y="181">Versioned prompts &amp; settings</text>
        <text x="36" y="223" fill="#55dfc3">✓</text><text x="68" y="223">Evidence-based severity</text>
        <text x="36" y="265" fill="#55dfc3">✓</text><text x="68" y="265">Responsible disclosure</text>
      </g>
    </g>

    <g transform="translate(550 785)">
      <rect width="460" height="322" rx="25" fill="#251d35" stroke="#624267" stroke-width="2"/>
      <text x="34" y="49" fill="#f8f1ff" font-size="25" font-weight="750">HARD BOUNDARIES</text>
      <g class="body">
        <text x="36" y="97" fill="#ff8ca2">×</text><text x="68" y="97">No live-service attacks</text>
        <text x="36" y="139" fill="#ff8ca2">×</text><text x="68" y="139">No reusable jailbreaks</text>
        <text x="36" y="181" fill="#ff8ca2">×</text><text x="68" y="181">No safeguard removal</text>
        <text x="36" y="223" fill="#ff8ca2">×</text><text x="68" y="223">No unauthorized targets</text>
        <text x="36" y="265" fill="#ff8ca2">×</text><text x="68" y="265">No operational abuse guidance</text>
      </g>
    </g>

    <g transform="translate(70 1140)">
      <text y="0" class="eyebrow">MEASURE • REPRODUCE • IMPROVE</text>
      <text y="40" fill="#f2f7ff" font-size="25" font-weight="700">Refusal quality  ·  Policy adherence  ·  Consistency  ·  Recovery  ·  Harm</text>
      <line x1="0" y1="74" x2="940" y2="74" stroke="#36506c"/>
      <text y="112" class="muted" font-size="18">A safe academic framework—not a guide to bypassing real safeguards.</text>
      <text x="940" y="112" text-anchor="end" fill="#62d8c3" font-size="18" font-weight="700">SHARE • DISCUSS • TEST RESPONSIBLY</text>
    </g>
  </g>
</svg>
