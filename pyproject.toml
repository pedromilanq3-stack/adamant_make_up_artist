[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-export-search"
version = "1.0.0"
description = "Pesquisa local e segura em exportações oficiais do Instagram"
requires-python = ">=3.11"

[project.optional-dependencies]
# Fala gerada pelo modelo em vez do modo espelho:
#   pip install -e ".[modelo]"  (e defina ANTHROPIC_API_KEY)
modelo = ["anthropic>=0.40"]

[project.scripts]
instagram-export-search = "instagram_archive.web:main"
cerebro = "cerebro.__main__:main"

[tool.setuptools.packages.find]
include = ["instagram_archive*", "cerebro*"]

[tool.setuptools.package-data]
instagram_archive = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

